<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер</title>
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Трекер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e7e6df; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --good-text: #006300; --bad-text: #b3261e;
  --good-bg: #e6f4e6; --warn-bg: #fdf3dc; --crit-bg: #fbe9e9; --none-bg: #efeee9;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #8f8d86;
    --grid: #2c2c2a; --axis: #45443f; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.06);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0a8f0a; --s7: #9085e9; --s8: #e66767;
    --good-text: #3fc43f; --bad-text: #ef7b7b;
    --good-bg: #173117; --warn-bg: #3a2f12; --crit-bg: #3b1a1a; --none-bg: #262624;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--page); color: var(--ink);
  font: 16px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; }

/* шапка */
.ab { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding-top: var(--top); }
.ab-in { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; }
.ab-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-back { border: 0; background: none; color: var(--s1); font-size: 17px; padding: 10px 8px 10px 0; margin-left: -2px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.sync-host { display: flex; }
.sync-chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 34px; }
.sync-chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync-chip[data-tone="ok"]::before { background: var(--good); }
.sync-chip[data-tone="warn"]::before { background: var(--warn); }
.sync-chip[data-tone="err"]::before { background: var(--crit); }
.sync-chip[data-tone="busy"]::before { background: var(--s1); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }

main { padding: 12px 16px calc(84px + var(--bottom)); }

/* нижняя панель вкладок */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding-bottom: var(--bottom); }
.tabbar-in { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
.tab { border: 0; background: none; padding: 7px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; min-height: 54px; }
.tab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--s1); font-weight: 600; }

/* блоки */
.sec { margin: 18px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--axis); flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.none { background: var(--axis); }

/* готовность */
.ready { display: flex; gap: 14px; align-items: center; }
.light { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #fff; flex: none; background: var(--muted); }
.light.good { background: var(--good); } .light.warn { background: var(--warn); color: #0b0b0b; } .light.crit { background: var(--crit); }
.ready-name { font-size: 20px; font-weight: 700; }
.ready-adv { color: var(--ink2); font-size: 15px; }
details.more { margin-top: 10px; }
details.more summary { cursor: pointer; color: var(--s1); font-size: 14px; list-style: none; padding: 4px 0; }
details.more summary::-webkit-details-marker { display: none; }
.conds { margin-top: 6px; }
.cond { display: flex; gap: 8px; padding: 7px 0; border-top: 1px solid var(--grid); font-size: 14px; }
.cond b { font-variant-numeric: tabular-nums; }
.mk { width: 18px; font-weight: 700; text-align: center; }
.mk.ok { color: var(--good-text); } .mk.no { color: var(--bad-text); } .mk.na { color: var(--muted); }

/* тренировка на «Сегодня» */
.sess { border-left: 5px solid var(--c); }
.sess-title { font-size: 18px; font-weight: 650; line-height: 1.25; }
.sess-meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
.act { border: 1px solid var(--border); background: var(--page); border-radius: 12px; min-height: 58px; padding: 6px 2px; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
.act .ic { font-size: 20px; line-height: 1; }
.act:active { transform: scale(.97); }
.act.good[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good); color: var(--good-text); font-weight: 600; }
.act.none[aria-pressed="true"] { background: var(--none-bg); border-color: var(--ink2); font-weight: 600; }
.act.crit[aria-pressed="true"] { background: var(--crit-bg); border-color: var(--crit); color: var(--bad-text); font-weight: 600; }
.act:disabled { opacity: .45; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 999px; margin-top: 10px; }
.status.good { background: var(--good-bg); color: var(--good-text); }
.status.crit { background: var(--crit-bg); color: var(--bad-text); }
.status.none { background: var(--none-bg); color: var(--ink2); }
.status.warn { background: var(--warn-bg); color: var(--ink); }
.linkbtn { border: 0; background: none; color: var(--s1); font-size: 15px; padding: 8px 0; cursor: pointer; }
.garmin { font-size: 13px; color: var(--ink2); margin-top: 8px; }

/* списки */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--grid); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; min-height: 56px; }
.li:first-child { border-top: 0; }
.li:active { background: var(--hover); }
.li .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
.li-title { font-size: 16px; font-weight: 550; }
.li-sub { font-size: 13px; color: var(--muted); }
.chev { color: var(--axis); font-size: 20px; }
.pill { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good-text); }
.pill.crit { background: var(--crit-bg); color: var(--bad-text); }
.pill.none { background: var(--none-bg); color: var(--ink2); }
.pill.warn { background: var(--warn-bg); color: var(--ink); }
.pill.todo { border: 1px dashed var(--axis); color: var(--ink2); }
.quick { display: flex; gap: 6px; }
.qbtn { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--page); font-size: 18px; cursor: pointer; }
.qbtn.ok { color: var(--good-text); } .qbtn.no { color: var(--bad-text); }

/* неделя */
.wk-head { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
.wk-nav { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 20px; cursor: pointer; }
.wk-nav:disabled { opacity: .35; }
.wk-t { flex: 1; text-align: center; }
.wk-t b { font-size: 17px; display: block; }
.meter { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--s1); }
.meter.good > i { background: var(--good); } .meter.warn > i { background: var(--warn); } .meter.crit > i { background: var(--crit); }
.day-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px 4px; font-weight: 650; }
.day-h .today { color: var(--s1); font-weight: 600; font-size: 13px; }
.day-h .dt { color: var(--muted); font-weight: 400; font-size: 14px; }
.day-h .dot { margin-left: auto; }
.day-rest { padding: 4px 14px 12px; color: var(--muted); font-size: 14px; }
.day-steps { padding: 0 14px 6px; color: var(--muted); font-size: 12.5px; }
.day-steps.ok { color: var(--good-text); }
.extra { padding: 4px 14px 10px; font-size: 13px; color: var(--muted); }

/* экран тренировки */
.detail-h { font-size: 24px; font-weight: 700; line-height: 1.2; margin: 4px 0 2px; }
.stgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stbtn { min-height: 60px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.stbtn .ic { font-size: 20px; }
.stbtn.good[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good); color: var(--good-text); font-weight: 650; }
.stbtn.none[aria-pressed="true"] { background: var(--none-bg); border-color: var(--ink2); font-weight: 650; }
.stbtn.crit[aria-pressed="true"] { background: var(--crit-bg); border-color: var(--crit); color: var(--bad-text); font-weight: 650; }
.stbtn:disabled { opacity: .45; }
textarea.note { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; min-height: 90px; resize: vertical; }
.saved { font-size: 13px; color: var(--muted); height: 18px; margin-top: 4px; }
.chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; min-height: 52px; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 2px; }
.chip b { font-size: 15px; }
.chip[aria-current="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.ex { margin: 6px 0 0; padding-left: 20px; font-size: 15px; }
.ex li { margin: 4px 0; }
.danger { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--crit); color: var(--bad-text); background: transparent; font-size: 16px; cursor: pointer; margin-top: 8px; }
.danger.armed { background: var(--crit); color: #fff; }
.big { width: 100%; min-height: 52px; border-radius: 14px; border: 0; background: var(--s1); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
.ghost { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; cursor: pointer; }

/* прогресс */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; }
.tile-l { font-size: 13px; color: var(--ink2); }
.tile-v { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile-s { font-size: 12.5px; color: var(--muted); }
.season { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.wk { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
.wk.cur { border-color: var(--s1); }
.wk-bar { width: 10px; height: 40px; border-radius: 3px; background: var(--grid); display: flex; align-items: flex-end; overflow: hidden; }
.wk-bar i { width: 100%; background: var(--s1); }
.wk-bar i.good { background: var(--good); } .wk-bar i.warn { background: var(--warn); } .wk-bar i.crit { background: var(--crit); }
.wk-n { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.badge { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-top: 1px solid var(--grid); opacity: .55; }
.badge:first-child { border-top: 0; }
.badge.on { opacity: 1; }
.badge-i { font-size: 24px; line-height: 1; color: var(--muted); }
.badge.on .badge-i { color: var(--s4); }
.badge-n { font-weight: 650; }
.badge-h { font-size: 13.5px; color: var(--ink2); }
.badge-w { font-size: 12.5px; color: var(--muted); }
.rules { font-size: 14px; }
.rules div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--grid); }
.rules div:first-child { border-top: 0; }

/* сообщения */
.toasts { position: fixed; left: 12px; right: 12px; top: calc(var(--top) + 60px); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { max-width: 520px; width: 100%; background: var(--ink); color: var(--page); border-radius: 14px; padding: 11px 14px; box-shadow: var(--shadow); animation: tin .22s ease-out; transition: opacity .4s, transform .4s; }
.toast.out { opacity: 0; transform: translateY(-8px); }
.toast b { display: block; }
.toast span { font-size: 13.5px; opacity: .85; }
@keyframes tin { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; transition: none; } }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }

/* питание */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 38px; font-size: 15px; cursor: pointer; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); font-weight: 600; }
.meal { border-top: 1px solid var(--grid); }
.meal:first-child { border-top: 0; }
.meal summary { display: flex; align-items: center; gap: 12px; padding: 11px 14px; cursor: pointer; list-style: none; min-height: 56px; }
.meal summary::-webkit-details-marker { display: none; }
.meal .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
.meal-slot { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.meal-name { font-size: 16px; font-weight: 600; line-height: 1.25; }
.meal-sub { font-size: 13px; color: var(--muted); }
.meal-body { padding: 0 14px 12px 30px; font-size: 14px; }
.meal-body table { width: 100%; border-collapse: collapse; }
.meal-body td { padding: 4px 0; border-top: 1px solid var(--grid); }
.meal-body td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meal-body ol { padding-left: 18px; margin: 8px 0 0; color: var(--ink2); }
.nt-sum { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 10px 14px; border-top: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.nt-sum .good { color: var(--good-text); font-weight: 600; } .nt-sum .bad { color: var(--bad-text); font-weight: 600; }
.nt-note { background: var(--warn-bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
.tmr { font-size: 14px; }
.tmr div { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--grid); }
.tmr div:first-child { border-top: 0; }
.tmr span:first-child { color: var(--muted); width: 72px; flex: none; }

/* закупка */
.buy-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.buy-top .grow b { font-size: 17px; }
.buy-tools { display: flex; gap: 8px; margin: 8px 0 4px; }
.buy-tools button { flex: 1; min-height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; cursor: pointer; }
.buy-tools button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
.bi { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--grid); min-height: 56px; cursor: pointer; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.bi:first-child { border-top: 0; }
.bi:active { background: var(--hover); }
.bi-box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--axis); flex: none; display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #fff; }
.bi.on .bi-box { background: var(--good); border-color: var(--good); }
.bi-name { font-size: 16px; }
.bi-hint { font-size: 12.5px; color: var(--muted); }
.bi-qty { font-size: 16px; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bi.on .bi-name, .bi.on .bi-qty { color: var(--muted); text-decoration: line-through; font-weight: 400; }
.buy-done { text-align: center; padding: 20px 12px; color: var(--good-text); font-weight: 600; }
</style>
</head>
<body>
<header class="ab"><div class="ab-in wrap">
  <button type="button" class="ab-back" id="back" hidden aria-label="Назад">‹ Назад</button>
  <div class="ab-title" id="title">Сегодня</div>
  <div class="sync-host" data-sync-host data-compact></div>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabbar" aria-label="Разделы"><div class="tabbar-in">
  <button type="button" class="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Сегодня</button>
  <button type="button" class="tab" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Неделя</button>
  <button type="button" class="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.8 3.9M17 6h2.5a2.5 2.5 0 0 1-2.8 3.9"/></svg>Прогресс</button>
  <button type="button" class="tab" data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v3H17"/></svg>Питание</button>
</div></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
"use strict";
(() => {
  /* ======================================================================
     Мобильное приложение-трекер. Общая логика (данные, план, очки, серии,
     синхронизация) вставлена из dashboard.html при сборке — не править здесь.
     ====================================================================== */
  const DAY = 86400000;
  const pad2 = (n) => String(n).padStart(2, '0');
  function fmtDate(t, withTime) {
    const d = new Date(t);

    if (x === null || x === undefined || x === '') return null;
    if (typeof x === 'number') return Number.isFinite(x) ? x : null;
    if (typeof x === 'boolean') return x ? 1 : 0;
    const s = String(x).replace(/[\s  ]/g, '').replace(',', '.');
    return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;
  },
  pos(x) { const n = U.num(x); return n !== null && n > 0 ? n : null; },
  // Дата/время -> { date: 'YYYY-MM-DD', t: ms (наивное локальное время, хранится как UTC) }
  when(x, date1904 = false) {
    if (x === null || x === undefined || x === '') return null;
    if (typeof x === 'number') {
      if (!Number.isFinite(x) || x < 1) return null;
      const t = Math.round(((date1904 ? x + 1462 : x) - 25569) * 86400000);
      return { date: new Date(t).toISOString().slice(0, 10), t };
    }
    const s = String(x).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (m) return U._mk(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);

    return null;

  _mk(y, mo, d, h, mi, s) {
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    const t = Date.UTC(y, mo - 1, d, h, mi, s);
    return { date: new Date(t).toISOString().slice(0, 10), t };

      for (const id of new Set([...Object.keys(a.log || {}), ...Object.keys(b.log || {})])) {

    /* ---------------- зоны: каждая — скачать → слить → при необходимости записать с условием */
    async function withRetry(fn) {

    // Данные Garmin/Picooc/анализов: meta + куски c0…cN
    const dataSig = (d) => (d.dataAt || '') + '|' + canon(d.overrides || {});
    async function syncData() {
      const base = `zones/${st.person}/data`;
      return withRetry(async () => {
        const meta = await getDoc(`${base}/meta`);
        let remote = null;
        if (meta && meta.updateTime !== st.ver.data) {
          const n = +meta.fields.n.integerValue;
          const parts = [];
          for (let i = 0; i < n; i++) {
            const d = await getDoc(`${base}/c${i}`);
            if (!d) throw Object.assign(new Error('Неполные данные в облаке'), { conflict: true });
            parts.push(unb64(d.fields.z.bytesValue));
          }
          const all = new Uint8Array(parts.reduce((x, p) => x + p.length, 0));
          let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
          remote = await ungz(all);
        }
        let changed = false;
        if (remote) {
          const md = mergeData(hasLocalData() || state.data.dataAt ? state.data : null, remote);
          if (md !== state.data) { state.data = Object.assign(blank(), md); saveData(); changed = true; }
        }
        const remoteSig = remote ? dataSig(remote) : meta ? st.ver.dataSig : null;
        const localSig = hasLocalData() || state.data.dataAt ? dataSig(state.data) : null;
        if (localSig && localSig !== remoteSig) {

          for (let i = 0; i < n; i++) writes.push({ update: { name: docName(`${base}/c${i}`), fields: { z: { bytesValue: b64(bytes.subarray(i * CHUNK, (i + 1) * CHUNK)) } } } });
          const oldN = meta ? +meta.fields.n.integerValue : 0;
          for (let i = n; i < oldN; i++) writes.push({ delete: docName(`${base}/c${i}`) });
          writes.push({ update: { name: docName(`${base}/meta`), fields: { n: { integerValue: String(n) }, size: { integerValue: String(bytes.length) }, dataAt: { stringValue: state.data.dataAt || '' }, at: { stringValue: new Date().toISOString() } } }, currentDocument: pre(meta) });
          const r = await commit(writes);

    // Свой трекер (вместе с планом и списком людей, чьи трекеры видит администратор)
    async function syncTracker() {

        const doc = await getDoc(path);
        const remote = await unpack(doc);
        let changed = false;
        const mt = mergeTracker(TR, remote);
        if (!sameTracker(mt, TR)) { TR = mt; setPlan(TR.plan); trSave(true); changed = true; }
        if (!remote || !sameTracker(TR, remote)) {
          if (TR.start || Object.keys(TR.sessions || {}).length || TR.plan || remote) {
            const r = await commit([{ update: { name: docName(path), fields: await pack(TR) }, currentDocument: pre(doc) }]);
            st.ver.tracker = r.writeResults[0].updateTime;
          }
        } else st.ver.tracker = doc.updateTime;
        return changed;
      });
    }
    // План, который прислал администратор (для участника): новее — заменяет план в трекере
    async function syncIncomingPlan() {
      const doc = await getDoc(`zones/${st.person}/tracker/plan`);
      if (!doc || doc.updateTime === st.ver.plan) return false;
      const p = await unpack(doc);
      st.ver.plan = doc.updateTime;
      if (!p || !p.start || ((TR.plan || {}).mt || '') >= (p.mt || '')) return false;
      applyPlan(p);
      return true;
    }
    // Питание: меню (пишет администратор), отметки (оба), дни сквоша (пишет администратор)
    async function syncNutrition() {
      let changed = false;
      // меню
      await withRetry(async () => {
        const doc = await getDoc('shared/menu');
        const rm = await unpack(doc);
        if (rm && rm.start && ((NT.data || {}).mt || '') < (rm.mt || '')) { NT.data = rm; ntSave(true); changed = true; }
        if (isAdmin() && NT.data && (!rm || (rm.mt || '') < (NT.data.mt || ''))) {
          await commit([{ update: { name: docName('shared/menu'), fields: await pack(NT.data) }, currentDocument: pre(doc) }]);
        }
      });

        if (canon(merged) !== canon(NT.marks)) { NT.marks = merged; ntSave(true); changed = true; }
        if (canon(merged) !== canon(rk)) await commit([{ update: { name: docName('shared/marks'), fields: await pack(merged) }, currentDocument: pre(doc) }]);
      });

    function squashDays() {

      const from = TR.start, to = U.msToDate(U.dayMs(TR.start) + TR.weeks * 7 * DAY);

    /* ---------------- цикл синхронизации */
    async function syncNow() {

  /* ====================================================================== интерфейс */

          const ok = h('button', 'qbtn ok', '✓'); ok.type = 'button'; ok.setAttribute('aria-label', 'Сделал'); ok.onclick = () => mark(s.id, 'done');
          const no = h('button', 'qbtn no', '✕'); no.type = 'button'; no.setAttribute('aria-label', 'Пропуск'); no.onclick = () => mark(s.id, 'skipped');
          q.appendChild(ok); q.appendChild(no);
          row.appendChild(q);
          list.appendChild(row);
        }
        view.appendChild(list);
      }
      // Garmin нашёл
      const found = [];
      for (let d = 0; d < 7; d++) {
        const date = iso(weekStart(cw) + d * DAY);
        if (U.dayMs(date) > today) break;
        for (const [sid, a] of Object.entries(matchDay(X, date).map)) if (!logOf(sid)) found.push([sid, a]);
      }
      if (found.length) {
        const b = h('button', 'big', `⌚ Отметить по Garmin (${found.length})`); b.type = 'button';
        b.onclick = () => { const bf = earned(); for (const [sid, a] of found) TR.log[sid] = { st: 'done', at: new Date().toISOString(), garmin: a.id, note: '' }; commit(bf); toast('Отмечено по Garmin', `${found.length} трен.`); };
        view.appendChild(b);
      }
    }

    // неделя и шаги
    view.appendChild(h('div', 'sec', 'Неделя'));

    const i = h('i'); i.style.width = Math.max(2, Math.round(ws.pct * 100)) + '%'; m.appendChild(i); wc.appendChild(m);
    const lastSteps = X.daily.filter(d => d.steps != null).at(-1);

      wc.appendChild(h('div', 'muted small', `Шаги ${N0.format(lastSteps.steps)} из ${N0.format(tgt)}${lastSteps.t < today ? ` · на ${dm(lastSteps.t)}` : ''}`)).style.marginTop = '8px';
    }
    view.appendChild(wc);

    const add = h('button', 'ghost', '+ Тренировка вне плана'); add.type = 'button';
    add.onclick = () => go({ add: true });
    view.appendChild(add);
  }

        row.appendChild(tx);

  function renderSession(s) {
    const today = todayMs();
    const t = U.dayMs(s.date);
    const l = logOf(s.id);
    titleEl.textContent = '';
    view.appendChild(h('div', 'muted', `${longDate(t)} · неделя ${weekOf(s.date) + 1}`));
    view.appendChild(h('div', 'detail-h', s.title));
    view.appendChild(h('div', 'muted', [(KIND[s.kind] || KIND.other).label, s.time, s.dur ? `${s.dur} мин` : '', s.optional ? 'по желанию' : '', s.extra ? 'вне плана' : ''].filter(Boolean).join(' · ')));

    view.appendChild(h('div', 'sec', 'Отметка'));
    if (t > today) view.appendChild(h('div', 'muted small', 'Отметить можно в день тренировки или позже.')).style.marginBottom = '8px';
    const g = h('div', 'stgrid');
    const opts = [['done', '✓', 'Сделал', 'good'], ['replaced', '↺', 'Зона 2', 'good'], ['rest', '☾', 'Отдых', 'none'], ['skipped', '✕', 'Пропуск', 'crit']];

      b.appendChild(h('span', 'ic', ic)); b.appendChild(h('span', null, lab));

        jb.disabled = !l.joker && !left;
        jb.onclick = () => { const bf = earned(); TR.log[s.id] = { ...l, joker: !l.joker, at: new Date().toISOString() }; commit(bf); };
        row.appendChild(jb);

      row.appendChild(h('span', 'grow'));

    if (m) view.appendChild(h('div', 'garmin', `⌚ Garmin: ${actName(m)} ${hm(m.durMin)}${m.avgHr ? `, пульс ${f0(m.avgHr)}` : ''}`));

    // заметка — сохраняется сама
    view.appendChild(h('div', 'sec', 'Заметка'));
    const ta = h('textarea', 'note'); ta.placeholder = 'Самочувствие, что делал, что изменил'; ta.value = (l && l.note) || '';
    const saved = h('div', 'saved');
    let tm = null;
    const persistNote = () => {
      clearTimeout(tm);
      const v = ta.value.trim();
      const cur = TR.log[s.id];
      if ((cur ? cur.note || '' : '') === v) return;
      if (cur) TR.log[s.id] = { ...cur, note: v, at: new Date().toISOString() };
      else { saved.textContent = 'Заметка сохранится вместе с отметкой'; return; }
      trSave(); saved.textContent = 'Сохранено';
    };
    ta.addEventListener('input', () => { saved.textContent = ''; clearTimeout(tm); tm = setTimeout(persistNote, 800); });
    ta.addEventListener('blur', persistNote);
    view.appendChild(ta); view.appendChild(saved);

    // задание
    const tpl = tplInfo(s.tpl);
    if (s.detail || (tpl && tpl.items)) {
      view.appendChild(h('div', 'sec', 'Задание'));
      const c = h('div', 'card');
      if (s.detail) c.appendChild(h('div', null, s.detail));
      if (tpl && tpl.items) {

        const ol = h('ol', 'ex');

        d.appendChild(ol);
        d.appendChild(h('div', 'muted small', `Заминка: ${tpl.cooldown}`));
        c.appendChild(d);
      }
      view.appendChild(c);
    }

    // перенос
    view.appendChild(h('div', 'sec', 'Перенести на'));
    const w = weekOf(s.date);
    const chips = h('div', 'chips');
    for (let d = 0; d < 7; d++) {
      const dt = weekStart(w) + d * DAY, date = iso(dt);
      const b = h('button', 'chip'); b.type = 'button';
      b.appendChild(h('b', null, WD[d])); b.appendChild(h('span', null, dm(dt)));
      b.setAttribute('aria-current', String(date === s.date));
      b.onclick = () => {
        if (date === s.date) return;
        const bf = earned();
        const msgs = moveSession(s.id, date);

        commit(bf);
      };
      chips.appendChild(b);
    }
    view.appendChild(chips);
    if (PAIR[s.tpl]) view.appendChild(h('div', 'muted small', 'Силовая A и короткий сквош переносятся вместе; плавание встаёт на освободившийся день.')).style.marginTop = '6px';

    // ещё
    const more = h('details', 'more'); more.style.marginTop = '22px';
    more.appendChild(h('summary', null, 'Ещё'));
    const del = h('button', 'danger', 'Удалить из плана'); del.type = 'button';
    let armed = false;
    del.onclick = () => {
      if (!armed) { armed = true; del.textContent = 'Нажмите ещё раз, чтобы удалить'; del.classList.add('armed'); setTimeout(() => { armed = false; del.textContent = 'Удалить из плана'; del.classList.remove('armed'); }, 4000); return; }
      delete TR.sessions[s.id]; delete TR.log[s.id]; tomb('s:' + s.id); tomb('l:' + s.id); trSave();
      toast('Удалено из плана');
      history.back();
    };
    more.appendChild(del);
    more.appendChild(h('div', 'muted small', 'Название, время, минуты и задание правятся в дашборде на компьютере.')).style.marginTop = '8px';
    view.appendChild(more);
  }

    titleEl.textContent = 'Вне плана';
    const today = todayMs();
    view.appendChild(h('div', 'muted', `${longDate(today)}. Выберите, что сделали, — тренировка сразу будет отмечена. Очков не даёт: они за соблюдение плана.`));

      const bar = h('span', 'bar'); bar.style.setProperty('--c', (KIND[b.kind] || KIND.other).color); row.appendChild(bar);
      row.appendChild(h('div', 'grow li-title', b.title));

    view.appendChild(sc);

    }

    renderSyncCard();

  /* ---------------------------------------------------------------- питание (только просмотр) */
  const LS_NPERSON = 'health-nutrition-person';
  let foodPid = (() => { try { return localStorage.getItem(LS_NPERSON) || 'v'; } catch (e) { return 'v'; } })();
  const LS_FOODVIEW = 'health-app-food-view';
  let foodView = (() => { try { return localStorage.getItem(LS_FOODVIEW) || 'menu'; } catch (e) { return 'menu'; } })();
  let buyW = null, buyHide = false;
  const gKg = (g) => (g >= 1000 ? `${N2.format(g / 1000)} кг` : `${N0.format(g)} г`);
  const gP = (g) => (g < 10 ? `${N1.format(g)} г` : `${N0.format(Math.round(g / 5) * 5)} г`);
  function renderFood() {
    titleEl.textContent = 'Питание';
    if (!hasNutrition()) {
      const c = h('div', 'card');
      c.appendChild(h('div', 'ready-name', 'Меню не загружено'));
      c.appendChild(h('div', 'muted', 'Меню приходит из облака после входа. Если его там ещё нет — загрузите nutrition\\nutrition.json на сайте на компьютере («Загрузить выгрузки»).'));
      view.appendChild(c);
      return renderSyncCard();
    }
    const N = NTD();
    const vs = h('div', 'seg');
    for (const [id, text] of [['menu', 'Меню'], ['buy', 'Закупка']]) { const b = h('button', null, text); b.type = 'button'; b.setAttribute('aria-pressed', String(id === foodView)); b.onclick = () => { foodView = id; try { localStorage.setItem(LS_FOODVIEW, id); } catch (e) { /* нет */ } render(); window.scrollTo(0, 0); }; vs.appendChild(b); }
    view.appendChild(vs);
    if (foodView === 'buy') return renderBuy();
    if (N.people.length > 1) {
      const seg = h('div', 'seg');
      for (const q of N.people) { const b = h('button', null, q.name); b.type = 'button'; b.setAttribute('aria-pressed', String(q.id === foodPid)); b.onclick = () => { foodPid = q.id; try { localStorage.setItem(LS_NPERSON, q.id); } catch (e) { /* нет */ } render(); }; seg.appendChild(b); }
      view.appendChild(seg);
    }
    const p = ntPerson(foodPid);
    const t = ntToday();
    const info = ntDay(t);
    if (info.before) view.appendChild(h('div', 'nt-note', `Меню стартует ${fmtDate(ntStart())}. Ниже — первый день меню.`));
    const t0 = info.before ? ntStart() : t;
    const d0 = ntDay(t0);
    view.appendChild(h('div', 'sec', `${t0 === t ? 'Сегодня' : 'Первый день'} · ${longDate(t0)} · неделя меню ${d0.idx + 1}`));
    if (d0.day.note) view.appendChild(h('div', 'nt-note', d0.day.note));
    const list = h('div', 'list');
    for (const m of ntMeals(t0, p)) {
      const r = N.recipes[m.rid] || { name: m.rid };
      const n = ntNutr(m.rid, p);
      const s = SRC[m.src] || SRC.morning;
      const det = h('details', 'meal');
      const sm = h('summary');
      const bar = h('span', 'bar'); bar.style.setProperty('--c', s.color); sm.appendChild(bar);
      const tx = h('div', 'grow');
      tx.appendChild(h('div', 'meal-slot', `${m.label} · ${s.short}`));
      tx.appendChild(h('div', 'meal-name', r.name));
      tx.appendChild(h('div', 'meal-sub', `${N0.format(n.kcal)} ккал · Б ${N0.format(n.P)} · Ж ${N0.format(n.F)} · У ${N0.format(n.C)}`));
      sm.appendChild(tx); sm.appendChild(h('span', 'chev', '›'));
      det.appendChild(sm);
      const body = h('div', 'meal-body');
      const port = ntPortion(m.rid, p);
      if (port.length) {
        const tb = h('table');
        for (const x of port) { const tr = h('tr'); tr.appendChild(h('td', null, x.prod)); tr.appendChild(h('td', null, gP(x.g))); tb.appendChild(tr); }
        body.appendChild(tb);
      }
      if ((r.steps || []).length) { const ol = h('ol'); for (const st of r.steps) ol.appendChild(h('li', null, st)); body.appendChild(ol); }
      det.appendChild(body);
      list.appendChild(det);
    }
    const tot = ntDayTotals(t0, p);
    const sum = h('div', 'nt-sum');
    const tk = ntTarget(p, 'kcal', t0), tpp = ntTarget(p, 'P', t0);
    sum.appendChild(h('span', null, 'Итого за день'));
    const r1 = h('span');
    r1.appendChild(h('span', ntTone(tot.kcal, tk) === 'bad' ? 'bad' : 'good', `${N0.format(tot.kcal)} ккал`));
    r1.appendChild(document.createTextNode(' · '));
    r1.appendChild(h('span', ntTone(tot.P, tpp) === 'bad' ? 'bad' : 'good', `Б ${N0.format(tot.P)}`));
    sum.appendChild(r1);
    list.appendChild(sum);
    view.appendChild(list);
    // завтра — кратко
    const t1 = t0 + DAY;
    view.appendChild(h('div', 'sec', `Завтра · ${longDate(t1)}`));
    const tm = h('div', 'card tmr');
    for (const m of ntMeals(t1, p)) { const row = h('div'); row.appendChild(h('span', null, m.label)); row.appendChild(h('span', null, (N.recipes[m.rid] || {}).name || m.rid)); tm.appendChild(row); }
    view.appendChild(tm);
    // вся неделя — обеды и ужины
    const wk = h('details', 'card more');
    wk.appendChild(h('summary', null, 'Вся неделя: обеды и ужины'));
    const w = ntWeekNo(t0), ws = ntWeekStart(w);
    const wl = h('div', 'tmr');
    for (let d = 0; d < 7; d++) {
      const td = ws + d * DAY, dd = ntDay(td).day;
      const row = h('div'); row.appendChild(h('span', null, `${WD_SUN[d]} ${dm(td)}`));
      row.appendChild(h('span', null, `${(N.recipes[dd.L] || {}).name || dd.L} / ${(N.recipes[dd.D] || {}).name || dd.D}`));
      wl.appendChild(row);
    }
    wk.appendChild(wl);
    view.appendChild(wk);
    view.appendChild(h('div', 'muted small', 'Закупка, заготовка и рецепты целиком — вкладка «Готовка» на сайте.'));
  }

  // Закупка: чеклист по магазинам, отметки синхронизируются с сайтом
  function renderBuy() {
    titleEl.textContent = 'Закупка';
    if (buyW == null) buyW = ntBuyWeek();
    const w = buyW, t0 = ntWeekStart(w);
    const head = h('div', 'wk-head');
    const prev = h('button', 'wk-nav', '‹'); prev.type = 'button'; prev.disabled = w <= 0; prev.setAttribute('aria-label', 'Предыдущая неделя');
    prev.onclick = () => { buyW--; render(); };
    const next = h('button', 'wk-nav', '›'); next.type = 'button'; next.setAttribute('aria-label', 'Следующая неделя');
    next.onclick = () => { buyW++; render(); };
    const tt = h('div', 'wk-t');
    tt.appendChild(h('b', null, `${dm(t0)} — ${dm(t0 + 6 * DAY)}`));
    tt.appendChild(h('span', 'muted small', `неделя меню ${ntMenuIdx(w) + 1}${w === ntBuyWeek() ? ' · к этой закупке' : ''}`));
    head.appendChild(prev); head.appendChild(tt); head.appendChild(next);
    view.appendChild(head);
    const list = ntBuyList(w);
    const done = list.filter(x => isMarked(x.key)).length;
    const top = h('div', 'card');
    const tr = h('div', 'buy-top');
    const tx = h('div', 'grow'); tx.appendChild(h('b', null, `Куплено ${done} из ${list.length}`)); tr.appendChild(tx);
    top.appendChild(tr);
    const m = h('div', 'meter ' + (done === list.length && list.length ? 'good' : '')); const mi = h('i'); mi.style.width = (list.length ? Math.round(done / list.length * 100) : 0) + '%'; m.appendChild(mi); top.appendChild(m);
    const tools = h('div', 'buy-tools');
    const hb = h('button', null, 'Скрыть купленное'); hb.type = 'button'; hb.setAttribute('aria-pressed', String(buyHide));
    hb.onclick = () => { buyHide = !buyHide; render(); };
    tools.appendChild(hb);
    top.appendChild(tools);
    top.appendChild(h('div', 'muted small', `Количество на двоих, с запасом ${Math.round((NTD().waste || 0) * 100)} % на отходы. Отметки видны на сайте и у всех, кто синхронизирован.`));
    view.appendChild(top);
    if (buyHide && done === list.length && list.length) { view.appendChild(h('div', 'buy-done', 'Всё куплено ✓')); return; }
    for (const st of ntStores(list)) {
      const its = list.filter(x => x.store === st);
      const nd = its.filter(x => isMarked(x.key)).length;
      const shown = buyHide ? its.filter(x => !isMarked(x.key)) : its;
      if (!shown.length) continue;
      view.appendChild(h('div', 'sec', `${st} · ${nd}/${its.length}`));
      const box = h('div', 'list');
      for (const x of shown) {
        const on = isMarked(x.key);
        const row = h('button', 'bi' + (on ? ' on' : '')); row.type = 'button';
        row.setAttribute('role', 'checkbox'); row.setAttribute('aria-checked', String(on));
        row.appendChild(h('span', 'bi-box', on ? '✓' : ''));
        const t = h('div', 'grow'); t.appendChild(h('div', 'bi-name', x.prod)); if (x.hint) t.appendChild(h('div', 'bi-hint', x.hint)); row.appendChild(t);
        row.appendChild(h('span', 'bi-qty', x.pcs ? `${x.pcs} шт` : gKg(x.buy)));
        row.onclick = () => { const y = window.scrollY; setMark(x.key, !isMarked(x.key)); render(); window.scrollTo(0, y); };
        box.appendChild(row);
      }
      view.appendChild(box);
    }
  }

  function renderSyncCard() {
    view.appendChild(h('div', 'sec', 'Синхронизация'));
    if (!Sync.enabled) { view.appendChild(h('div', 'card muted', 'Синхронизация работает только на сайте.')); return; }
    view.appendChild(Sync.accountBox(render));
    const full = h('a', 'ghost'); full.href = '../'; full.textContent = 'Открыть полный дашборд';
    full.style.cssText = 'display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);margin-top:4px';
    view.appendChild(full);
  }

  /* ---------------------------------------------------------------- запуск */
  load();
  history.replaceState({ ...nav }, '');
  render();
  Sync.start();
  // полночь и возврат в приложение — перерисовать «Сегодня»
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
})();
</script>
</body>
</html>
